name: Build Kotatsu with MangaK patch

on:
  push:
    branches:
      - devel
      - main
      - master
  workflow_dispatch:
    inputs:
      parser_repo:
        description: "Parser repo"
        required: true
        default: "KotatsuApp/kotatsu-parsers"
      parser_ref:
        description: "Parser ref"
        required: true
        default: "master"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PARSER_REPO: ${{ github.event.inputs.parser_repo || 'KotatsuApp/kotatsu-parsers' }}
      PARSER_REF: ${{ github.event.inputs.parser_ref || 'master' }}
      TARGET_PARSER_FILE: src/main/kotlin/org/koitharu/kotatsu/parsers/site/madtheme/en/MangaPuma.kt

    steps:
      - name: Checkout Kotatsu
        uses: actions/checkout@v4
        with:
          path: Kotatsu

      - name: Checkout kotatsu-parsers
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARSER_REPO }}
          ref: ${{ env.PARSER_REF }}
          path: kotatsu-parsers

      - name: Verify patch file exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "Kotatsu/patches/MangaPuma.kt" ]; then
            echo "Missing Kotatsu/patches/MangaPuma.kt"
            echo "Create patches/MangaPuma.kt in your Kotatsu repo first."
            exit 1
          fi

          grep -q '@MangaSourceParser("MANGAPUMA", "MangaK", "en")' Kotatsu/patches/MangaPuma.kt

      - name: Patch MangaPuma parser
        shell: bash
        run: |
          set -euo pipefail

          TARGET="kotatsu-parsers/${TARGET_PARSER_FILE}"

          if [ ! -f "$TARGET" ]; then
            echo "Target parser does not exist: $TARGET"
            exit 1
          fi

          cp "$TARGET" "$TARGET.bak"
          cp Kotatsu/patches/MangaPuma.kt "$TARGET"

          echo "Patched parser preview:"
          sed -n '1,80p' "$TARGET"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Wire Kotatsu to patched local kotatsu-parsers
        working-directory: Kotatsu
        shell: bash
        run: |
          set -euo pipefail

          cat >> settings.gradle <<'EOF'

          includeBuild('../kotatsu-parsers') {
              dependencySubstitution {
                  substitute module('com.github.KotatsuApp:kotatsu-parsers') using project(':')
              }
          }
          EOF

          cat settings.gradle

      - name: Build debug APK
        working-directory: Kotatsu
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotatsu-mangak-debug-apk
          path: Kotatsu/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload patched parser source
        uses: actions/upload-artifact@v4
        with:
          name: patched-MangaPuma-source
          path: kotatsu-parsers/src/main/kotlin/org/koitharu/kotatsu/parsers/site/madtheme/en/MangaPuma.kt
          if-no-files-found: error
