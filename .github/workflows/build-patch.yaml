name: Build Aksara with MangaK and HotComics patches

on:
  push:
    branches:
      - devel
      - main
      - master
  workflow_dispatch:
    inputs:
      parser_repo:
        description: "Parser repo"
        required: true
        default: "KotatsuApp/kotatsu-parsers"
      parser_ref:
        description: "Parser ref"
        required: true
        default: "master"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PARSER_REPO: ${{ github.event.inputs.parser_repo || 'KotatsuApp/kotatsu-parsers' }}
      PARSER_REF: ${{ github.event.inputs.parser_ref || 'master' }}
      AKSARA_APPLICATION_ID: org.felzard.aksara
      AKSARA_APP_NAME: Aksara
      TARGET_MANGAPUMA: src/main/kotlin/org/koitharu/kotatsu/parsers/site/madtheme/en/MangaPuma.kt
      TARGET_HOTCOMICS: src/main/kotlin/org/koitharu/kotatsu/parsers/site/hotcomics/en/HotComics.kt
      TARGET_HOTCOMICS_PARSER: src/main/kotlin/org/koitharu/kotatsu/parsers/site/hotcomics/HotComicsParser.kt

    steps:
      - name: Checkout Aksara
        uses: actions/checkout@v4
        with:
          path: Kotatsu

      - name: Checkout kotatsu-parsers
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARSER_REPO }}
          ref: ${{ env.PARSER_REF }}
          path: kotatsu-parsers

      - name: Verify patch files exist
        shell: bash
        run: |
          set -euo pipefail

          test -f Kotatsu/patches/MangaPuma.kt || { echo "Missing patches/MangaPuma.kt"; exit 1; }
          test -f Kotatsu/patches/HotComics.kt || { echo "Missing patches/HotComics.kt"; exit 1; }
          test -f Kotatsu/patches/HotComicsParser.kt || { echo "Missing patches/HotComicsParser.kt"; exit 1; }
          test -f Kotatsu/patches/icon.png || { echo "Missing patches/icon.png"; exit 1; }

          grep -q '@MangaSourceParser("MANGAPUMA", "MangaK", "en")' Kotatsu/patches/MangaPuma.kt
          grep -q '@MangaSourceParser("HOTCOMICS", "HotComics", "en")' Kotatsu/patches/HotComics.kt

      - name: Patch kotatsu-parsers sources
        shell: bash
        run: |
          set -euo pipefail

          cp "kotatsu-parsers/${TARGET_MANGAPUMA}" "kotatsu-parsers/${TARGET_MANGAPUMA}.bak"
          cp "kotatsu-parsers/${TARGET_HOTCOMICS}" "kotatsu-parsers/${TARGET_HOTCOMICS}.bak"
          cp "kotatsu-parsers/${TARGET_HOTCOMICS_PARSER}" "kotatsu-parsers/${TARGET_HOTCOMICS_PARSER}.bak"

          cp Kotatsu/patches/MangaPuma.kt "kotatsu-parsers/${TARGET_MANGAPUMA}"
          cp Kotatsu/patches/HotComics.kt "kotatsu-parsers/${TARGET_HOTCOMICS}"
          cp Kotatsu/patches/HotComicsParser.kt "kotatsu-parsers/${TARGET_HOTCOMICS_PARSER}"

          echo "MangaPuma patch preview:"
          sed -n '1,40p' "kotatsu-parsers/${TARGET_MANGAPUMA}"
          echo "HotComics patch preview:"
          sed -n '1,60p' "kotatsu-parsers/${TARGET_HOTCOMICS}"

      - name: Rebrand as separate Aksara app
        working-directory: Kotatsu
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          app_id = "org.felzard.aksara"
          app_name = "Aksara"

          gradle = Path("app/build.gradle")
          s = gradle.read_text()
          s = re.sub(r"applicationId\s+['\"]org\.koitharu\.kotatsu['\"]", f"applicationId '{app_id}'", s)
          gradle.write_text(s)

          strings = Path("app/src/main/res/values/strings.xml")
          s = strings.read_text()
          s = re.sub(r'(<string name="app_name"[^>]*>).*?(</string>)', rf'\1{app_name}\2', s)
          strings.write_text(s)

          manifest = Path("app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/aksara_icon"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/aksara_icon"')
          manifest.write_text(s)
          PY

          mkdir -p app/src/main/res/drawable
          cp patches/icon.png app/src/main/res/drawable/aksara_icon.png

          echo "Patched applicationId:"
          grep -n "applicationId" app/build.gradle | head
          echo "Patched app_name:"
          grep -n 'name="app_name"' app/src/main/res/values/strings.xml
          echo "Patched manifest icon:"
          grep -n 'android:icon\|android:roundIcon' app/src/main/AndroidManifest.xml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Wire Aksara to patched local kotatsu-parsers
        working-directory: Kotatsu
        shell: bash
        run: |
          set -euo pipefail

          cat >> settings.gradle <<'EOF'

          includeBuild('../kotatsu-parsers') {
              dependencySubstitution {
                  substitute module('com.github.KotatsuApp:kotatsu-parsers') using project(':')
              }
          }
          EOF

          cat settings.gradle

      - name: Build debug APK
        working-directory: Kotatsu
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aksara-mangak-hotcomics-debug-apk
          path: Kotatsu/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload patched parser sources
        uses: actions/upload-artifact@v4
        with:
          name: patched-parser-sources
          path: |
            kotatsu-parsers/src/main/kotlin/org/koitharu/kotatsu/parsers/site/madtheme/en/MangaPuma.kt
            kotatsu-parsers/src/main/kotlin/org/koitharu/kotatsu/parsers/site/hotcomics/en/HotComics.kt
            kotatsu-parsers/src/main/kotlin/org/koitharu/kotatsu/parsers/site/hotcomics/HotComicsParser.kt
          if-no-files-found: error
