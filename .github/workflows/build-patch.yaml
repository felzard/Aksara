name: Build Aksara release-only with MangaK and HotComics patches and renamed

on:
  push:
    branches:
      - devel
      - main
      - master
  workflow_dispatch:
    inputs:
      parser_repo:
        description: "Parser repo"
        required: true
        default: "KotatsuApp/kotatsu-parsers"
      parser_ref:
        description: "Parser ref"
        required: true
        default: "master"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PARSER_REPO: ${{ github.event.inputs.parser_repo || 'KotatsuApp/kotatsu-parsers' }}
      PARSER_REF: ${{ github.event.inputs.parser_ref || 'master' }}

    steps:
      - name: Checkout Aksara
        uses: actions/checkout@v4
        with:
          path: Kotatsu

      - name: Checkout kotatsu-parsers
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARSER_REPO }}
          ref: ${{ env.PARSER_REF }}
          path: kotatsu-parsers

      - name: Verify patch files
        shell: bash
        run: |
          set -euo pipefail

          test -f Kotatsu/patches/MangaPuma.kt
          test -f Kotatsu/patches/HotComics.kt
          test -f Kotatsu/patches/HotComicsParser.kt
          test -f Kotatsu/patches/icon.png

          grep -q '@MangaSourceParser("MANGAPUMA", "MangaK", "en")' Kotatsu/patches/MangaPuma.kt
          grep -q '@MangaSourceParser("HOTCOMICS", "HotComics", "en")' Kotatsu/patches/HotComics.kt

      - name: Patch MangaPuma and HotComics parsers
        shell: bash
        run: |
          set -euo pipefail

          MANGAPUMA_TARGET="kotatsu-parsers/src/main/kotlin/org/koitharu/kotatsu/parsers/site/madtheme/en/MangaPuma.kt"
          HOTCOMICS_TARGET="kotatsu-parsers/src/main/kotlin/org/koitharu/kotatsu/parsers/site/hotcomics/en/HotComics.kt"
          HOTCOMICS_BASE_TARGET="kotatsu-parsers/src/main/kotlin/org/koitharu/kotatsu/parsers/site/hotcomics/HotComicsParser.kt"

          test -f "$MANGAPUMA_TARGET"
          test -f "$HOTCOMICS_TARGET"
          test -f "$HOTCOMICS_BASE_TARGET"

          cp "$MANGAPUMA_TARGET" "$MANGAPUMA_TARGET.bak"
          cp "$HOTCOMICS_TARGET" "$HOTCOMICS_TARGET.bak"
          cp "$HOTCOMICS_BASE_TARGET" "$HOTCOMICS_BASE_TARGET.bak"

          cp Kotatsu/patches/MangaPuma.kt "$MANGAPUMA_TARGET"
          cp Kotatsu/patches/HotComics.kt "$HOTCOMICS_TARGET"
          cp Kotatsu/patches/HotComicsParser.kt "$HOTCOMICS_BASE_TARGET"

          echo "MangaPuma preview:"
          sed -n '1,50p' "$MANGAPUMA_TARGET"

          echo "HotComics preview:"
          sed -n '1,80p' "$HOTCOMICS_TARGET"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable Aksara signing keystore
        working-directory: Kotatsu
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "patches/aksara.keystore.b64" ]; then
            echo "Missing patches/aksara.keystore.b64"
            echo "This repo-based keystore is required so updates are signed with the same key every run."
            exit 1
          fi

          mkdir -p ci-signing
          tr -d '\n\r ' < patches/aksara.keystore.b64 | base64 -d > ci-signing/aksara.keystore
          test -s ci-signing/aksara.keystore

      - name: Wire Aksara to patched local kotatsu-parsers
        working-directory: Kotatsu
        shell: bash
        run: |
          set -euo pipefail

          cat >> settings.gradle <<'EOF'

          includeBuild('../kotatsu-parsers') {
              dependencySubstitution {
                  substitute module('com.github.KotatsuApp:kotatsu-parsers') using project(':')
              }
          }
          EOF

          cat settings.gradle

      - name: Patch Aksara app identity, sync authorities, signing, and icon
        working-directory: Kotatsu
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user pillow

          python3 - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image, ImageOps

          APP_ID_NEW = "org.felzard.aksara"
          APP_NAME = "Aksara"

          # 1) Change install identity and add stable release signing config.
          build = Path("app/build.gradle")
          text = build.read_text(encoding="utf-8")

          text = re.sub(
              r"applicationId\s+'org\.koitharu\.kotatsu'",
              "applicationId 'org.felzard.aksara'",
              text,
              count=1,
          )

          signing_block = (
              "signingConfigs {\n"
              "\t\taksaraRelease {\n"
              "\t\t\tstoreFile file('../ci-signing/aksara.keystore')\n"
              "\t\t\tstorePassword 'aksara123'\n"
              "\t\t\tkeyAlias 'aksara'\n"
              "\t\t\tkeyPassword 'aksara123'\n"
              "\t\t}\n"
              "\t}\n\n"
              "\tbuildTypes {"
          )

          if "aksaraRelease {" not in text:
              text = text.replace("buildTypes {", signing_block, 1)

          text = text.replace(
              "signingConfig signingConfigs.debug\n\t\t\tminifyEnabled true",
              "signingConfig signingConfigs.aksaraRelease\n\t\t\tminifyEnabled true",
          )

          if "release {\n\t\t\tsigningConfig signingConfigs.aksaraRelease" not in text:
              text = text.replace(
                  "release {\n\t\t\tminifyEnabled true",
                  "release {\n\t\t\tsigningConfig signingConfigs.aksaraRelease\n\t\t\tminifyEnabled true",
                  1,
              )

          build.write_text(text, encoding="utf-8")

          # 2) Change app label.
          for path in [
              Path("app/src/main/res/values/strings.xml"),
              Path("app/src/debug/res/values/strings.xml"),
          ]:
              if not path.exists():
                  continue
              s = path.read_text(encoding="utf-8")
              s = re.sub(
                  r'<string name="app_name"[^>]*>.*?</string>',
                  f'<string name="app_name" translatable="false">{APP_NAME}</string>',
                  s,
                  count=1,
              )
              path.write_text(s, encoding="utf-8")
              print(f"patched app_name: {path}")

          # 3) Fix ONLY string resources used as account/sync/provider authorities.
          # Do NOT globally replace org.koitharu.kotatsu in res XML.
          # Layout XML contains custom view class names such as org.koitharu.kotatsu.*.
          replacements = {
              "account_type_sync": "org.felzard.aksara.sync",
              "sync_authority_favourites": "org.felzard.aksara.sync.favourites",
              "sync_authority_history": "org.felzard.aksara.sync.history",
          }

          found = set()
          values_dirs = []
          for src_set in [Path("app/src/main/res"), Path("app/src/debug/res")]:
              if not src_set.exists():
                  continue
              values_dirs.extend([p for p in src_set.iterdir() if p.is_dir() and p.name.startswith("values")])

          for values_dir in values_dirs:
              for path in values_dir.glob("*.xml"):
                  s = path.read_text(encoding="utf-8")
                  ns = s

                  for name, value in replacements.items():
                      pattern = rf'(<string\s+name="{re.escape(name)}"[^>]*>).*?(</string>)'
                      ns2, count = re.subn(pattern, rf'\g<1>{value}\2', ns)
                      if count:
                          found.add(name)
                          ns = ns2

                  if ns != s:
                      path.write_text(ns, encoding="utf-8")
                      print(f"patched sync authority strings: {path}")

          missing = set(replacements) - found
          if missing:
              # Create only missing definitions. If upstream already has them, the regex above patches them.
              out = Path("app/src/main/res/values/aksara_sync_authorities.xml")
              body = [
                  '<?xml version="1.0" encoding="utf-8"?>',
                  '<resources>',
              ]
              for name in sorted(missing):
                  body.append(f'    <string name="{name}" translatable="false">{replacements[name]}</string>')
              body.append('</resources>')
              out.write_text("\n".join(body) + "\n", encoding="utf-8")
              print(f"created missing sync authority strings: {out} -> {sorted(missing)}")

          # 4) Replace launcher icon. Delete old .webp/.png first to avoid duplicate resources.
          icon_path = Path("patches/icon.png")
          if not icon_path.exists():
              raise SystemExit("Missing patches/icon.png")

          src = Image.open(icon_path).convert("RGBA")

          densities = {
              "mdpi": 108,
              "hdpi": 162,
              "xhdpi": 216,
              "xxhdpi": 324,
              "xxxhdpi": 432,
          }

          names = (
              "ic_launcher",
              "ic_launcher_round",
              "ic_launcher_foreground",
          )

          for density, size in densities.items():
              out_dir = Path(f"app/src/main/res/mipmap-{density}")
              out_dir.mkdir(parents=True, exist_ok=True)

              for stem in names:
                  for ext in ("png", "webp", "jpg", "jpeg"):
                      old = out_dir / f"{stem}.{ext}"
                      if old.exists():
                          old.unlink()
                          print(f"deleted old icon resource: {old}")

              canvas = Image.new("RGBA", (size, size), (255, 255, 255, 0))
              fitted = ImageOps.contain(src, (size, size), Image.Resampling.LANCZOS)
              canvas.alpha_composite(fitted, ((size - fitted.width) // 2, (size - fitted.height) // 2))

              for stem in names:
                  out = out_dir / f"{stem}.png"
                  canvas.save(out)
                  print(f"wrote icon: {out}")

          # 5) Replace Android 12+ launch splash logo.
          # Kotatsu uses @drawable/avd_splash as windowSplashScreenAnimatedIcon in values-v31/themes.xml.
          # Override it with a static PNG generated from patches/icon.png.
          splash_dir = Path("app/src/main/res/drawable-nodpi")
          splash_dir.mkdir(parents=True, exist_ok=True)

          splash_size = 432
          splash_canvas = Image.new("RGBA", (splash_size, splash_size), (255, 255, 255, 0))
          splash_icon = ImageOps.contain(src, (splash_size, splash_size), Image.Resampling.LANCZOS)
          splash_canvas.alpha_composite(
              splash_icon,
              ((splash_size - splash_icon.width) // 2, (splash_size - splash_icon.height) // 2),
          )
          splash_out = splash_dir / "aksara_splash_icon.png"
          splash_canvas.save(splash_out)
          print(f"wrote splash icon: {splash_out}")

          for theme_path in [
              Path("app/src/main/res/values-v31/themes.xml"),
              Path("app/src/main/res/values-v31/styles.xml"),
          ]:
              if not theme_path.exists():
                  continue

              theme = theme_path.read_text(encoding="utf-8")
              theme = theme.replace(
                  "@drawable/avd_splash",
                  "@drawable/aksara_splash_icon",
              )
              theme_path.write_text(theme, encoding="utf-8")
              print(f"patched Android 12 splash icon: {theme_path}")

          print("Aksara CI source patch complete")
          PY

      - name: Build release APK
        working-directory: Kotatsu
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew clean assembleRelease --stacktrace --no-daemon

      - name: Verify release output only
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find Kotatsu/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"

          if [ -z "$APK" ]; then
            echo "No release APK found"
            exit 1
          fi

          echo "Release APK: $APK"

          if find Kotatsu/app/build/outputs/apk/debug -name "*.apk" -type f 2>/dev/null | grep -q .; then
            echo "Debug APK exists. Refusing upload."
            find Kotatsu/app/build/outputs/apk/debug -name "*.apk" -type f -print
            exit 1
          fi

          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"

          if [ -z "$AAPT" ]; then
            echo "aapt not found under $ANDROID_HOME/build-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name 'aapt*' || true
            exit 1
          fi

          echo "Using aapt: $AAPT"

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING"

          PKG="$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"

          echo "Detected package: $PKG"

          if [ "$PKG" != "org.felzard.aksara" ]; then
            echo "Wrong package: expected org.felzard.aksara, got $PKG"
            exit 1
          fi

          if [ "$PKG" = "org.felzard.aksara.debug" ]; then
            echo "Wrong package: debug suffix detected"
            exit 1
          fi

          echo "Checking manifest provider authorities..."
          MANIFEST="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          echo "$MANIFEST" | grep -i "authorities" || true

          if echo "$MANIFEST" | grep -q "authorities.*org.koitharu.kotatsu"; then
            echo "Provider authority still conflicts with installed Kotatsu"
            exit 1
          fi

          LABEL="$(echo "$BADGING" | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" | head -n 1 || true)"
          echo "Detected label: ${LABEL:-unknown}"

          if [ "${LABEL:-}" != "Aksara" ]; then
            echo "Warning: app label is not Aksara. Continuing because package is correct."
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aksara-release-only-apk
          path: Kotatsu/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload patched parser sources
        uses: actions/upload-artifact@v4
        with:
          name: patched-parser-sources
          path: |
            kotatsu-parsers/src/main/kotlin/org/koitharu/kotatsu/parsers/site/madtheme/en/MangaPuma.kt
            kotatsu-parsers/src/main/kotlin/org/koitharu/kotatsu/parsers/site/hotcomics/en/HotComics.kt
            kotatsu-parsers/src/main/kotlin/org/koitharu/kotatsu/parsers/site/hotcomics/HotComicsParser.kt
          if-no-files-found: error
